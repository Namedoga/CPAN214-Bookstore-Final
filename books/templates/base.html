<!DOCTYPE html>
<html>
<head>
    {% load static %}
<link rel="stylesheet" href="{% static 'styles.css' %}">
    <title>Bookstore</title>
</head>
<body>

<nav>
    {% if user.is_authenticated %}
        <a href="/">Home</a> |
        <a href="/book/add/">Add Book</a> |
        <a href="/logout/">Logout</a>
    {% else %}
        <a href="/">Home</a> |
        <a href="/login/">Login</a> |
        <a href="/register/">Register</a>
    {% endif %}
</nav>

<hr>
    {% block content %}
{% endblock %}

</body>
</html>
