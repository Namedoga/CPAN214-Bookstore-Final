{% extends "base.html" %}

{% block content %}
    {% if form_mode == "add" %}
        <h2>Add Book</h2>
    {% else %}
        <h2>Edit Book</h2>
    {% endif %}

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="title"
               value="{{ book.title|default:title|default:'' }}" required>

        <label>Author:</label>
        <input type="text" name="author"
               value="{{ book.author|default:author|default:'' }}" required>

        <label>Year:</label>
        <input type="number" name="year"
               value="{{ book.year|default:year|default:'' }}" required>

        <label>Rating:</label>
        <input type="number" step="0.1" name="rating"
               value="{{ book.rating|default:rating|default:'' }}" required>

        <label>Description:</label>
        <textarea name="description" rows="4" required>{{ book.description|default:description|default:'' }}</textarea>

        <button type="submit">
            {% if form_mode == "add" %}
                Add Book
            {% else %}
                Save Changes
            {% endif %}
        </button>
    </form>

    <p><a href="{% url 'home' %}">Back to Home</a></p>
{% endblock %}
