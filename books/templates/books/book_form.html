{% extends "base.html" %}

{% block content %}
    {% if form_mode == "add" %}
        <h2>Add Book</h2>
    {% else %}
        <h2>Edit Book</h2>
    {% endif %}

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- TITLE -->
        <label>Title:</label>
        <input type="text" name="title"
               value="{% if book %}{{ book.title }}{% endif %}"
               required><br><br>

        <!-- AUTHOR -->
        <label>Author:</label>
        <input type="text" name="author"
               value="{% if book %}{{ book.author }}{% endif %}"
               required><br><br>

        <!-- YEAR -->
        <label>Year:</label>
        <input type="number" name="year"
               value="{% if book %}{{ book.year }}{% endif %}"
               required><br><br>

        <!-- RATING -->
        <label>Rating:</label>
        <input type="number" step="0.1" name="rating"
               value="{% if book %}{{ book.rating }}{% endif %}"
               required><br><br>

        <!-- DESCRIPTION -->
        <label>Description:</label>
        <textarea name="description" rows="4" required>{% if book %}{{ book.description }}{% endif %}</textarea><br><br>

        <button type="submit">
            {% if form_mode == "add" %}
                Add Book
            {% else %}
                Save Changes
            {% endif %}
        </button>
    </form>

    <br>
    <a href="{% url 'home' %}">Back to Home</a>
{% endblock %}
